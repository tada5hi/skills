<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skd-title">
    <title id="skd-title">tada5hi/skills logo: a fanned deck of skill cards, the top one showing YAML frontmatter</title>
    <defs>
        <linearGradient id="skd-tile" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
            <stop stop-color="#84CC16" stop-opacity="0.16"/>
            <stop offset="1" stop-color="#16A34A" stop-opacity="0.16"/>
        </linearGradient>
        <linearGradient id="skd-edge" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
            <stop stop-color="#84CC16"/>
            <stop offset="1" stop-color="#16A34A"/>
        </linearGradient>
        <linearGradient id="skd-card" x1="80" y1="60" x2="176" y2="188" gradientUnits="userSpaceOnUse">
            <stop stop-color="#A3E635"/>
            <stop offset="1" stop-color="#16A34A"/>
        </linearGradient>
    </defs>

    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#skd-tile)"/>
    <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" stroke="url(#skd-edge)" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- back cards fan out once and settle; the transform attribute is the resting state for renderers without SMIL -->
    <rect transform="rotate(-16 128 204)" x="80" y="62" width="96" height="128" rx="14" fill="#16A34A" fill-opacity="0.18" stroke="#16A34A" stroke-opacity="0.6" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="0 128 204; -16 128 204" dur="1.2s" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.2 1" repeatCount="1" fill="freeze"/>
    </rect>
    <rect transform="rotate(16 128 204)" x="80" y="62" width="96" height="128" rx="14" fill="#84CC16" fill-opacity="0.2" stroke="#65A30D" stroke-opacity="0.6" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="0 128 204; 16 128 204" dur="1.2s" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.2 1" repeatCount="1" fill="freeze"/>
    </rect>

    <!-- top card: frontmatter fences around name and description, then the body -->
    <rect x="80" y="62" width="96" height="128" rx="14" fill="url(#skd-card)"/>
    <g fill="#FFFFFF">
        <rect x="94" y="80" width="12" height="5" rx="2.5" fill-opacity="0.9"/>
        <rect x="110" y="80" width="12" height="5" rx="2.5" fill-opacity="0.9"/>
        <rect x="126" y="80" width="12" height="5" rx="2.5" fill-opacity="0.9"/>
        <rect x="94" y="96" width="50" height="7" rx="3.5" fill-opacity="0.95"/>
        <rect x="94" y="111" width="68" height="7" rx="3.5" fill-opacity="0.7"/>
        <rect x="94" y="126" width="12" height="5" rx="2.5" fill-opacity="0.9"/>
        <rect x="110" y="126" width="12" height="5" rx="2.5" fill-opacity="0.9"/>
        <rect x="126" y="126" width="12" height="5" rx="2.5" fill-opacity="0.9"/>
        <rect x="94" y="144" width="60" height="6" rx="3" fill-opacity="0.5"/>
        <rect x="94" y="157" width="68" height="6" rx="3" fill-opacity="0.5"/>
        <rect x="94" y="170" width="40" height="6" rx="3" fill-opacity="0.5"/>
    </g>
</svg>
