<svg width="960" height="380" viewBox="0 0 960 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ska-title ska-desc">
    <title id="ska-title">How skills get from this repository into your agent</title>
    <desc id="ska-desc">Skills come from two sources: manual skills written in this repository, and vendor skills copied from git submodules by npm run skills:sync. Both land in skills/, one directory per skill, and every one is declared in src/meta.ts. From there you install them through the skills CLI, the Claude Code plugin or the Codex plugin.</desc>

    <style>
        :root {
            --fg: #1F2328;
            --muted: #59636E;
            --panel: #F6F8FA;
            --panel-edge: #D1D9E0;
            --card: #FFFFFF;
            --rail: #8C959F;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #F0F6FC;
                --muted: #9198A1;
                --panel: #151B23;
                --panel-edge: #3D444D;
                --card: #0D1117;
                --rail: #656C76;
            }
        }
        text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--fg); }
        .muted { fill: var(--muted); }
        .code { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
        .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted); }
        .title { font-size: 15px; font-weight: 600; }
        .panel { fill: var(--panel); stroke: var(--panel-edge); }
        .card { fill: var(--card); }
        .rail { stroke: var(--rail); }
        .chip { fill: var(--card); stroke: var(--panel-edge); }
    </style>

    <defs>
        <marker id="ska-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#8C959F"/>
        </marker>
    </defs>

    <!-- sources -->
    <rect class="panel" x="16" y="16" width="280" height="284" rx="18"/>
    <text class="label" x="36" y="44">sources</text>

    <rect class="card" x="36" y="64" width="240" height="96" rx="12" stroke="#8B5CF6" stroke-width="1.5"/>
    <text class="title" x="54" y="92">Manual skills</text>
    <text class="code muted" x="54" y="116" font-size="12">skills/&lt;name&gt;/SKILL.md</text>
    <text class="muted" x="54" y="140" font-size="12">written in this repository</text>

    <rect class="card" x="36" y="184" width="240" height="96" rx="12" stroke="#0EA5E9" stroke-width="1.5"/>
    <text class="title" x="54" y="212">Vendor skills</text>
    <text class="code muted" x="54" y="236" font-size="12">vendor/&lt;repo&gt; submodules</text>
    <text class="muted" x="54" y="260" font-size="12">copied by npm run skills:sync</text>

    <!-- registry -->
    <rect class="panel" x="336" y="16" width="280" height="284" rx="18"/>
    <text class="label" x="356" y="44">registry</text>

    <rect class="card" x="356" y="64" width="240" height="80" rx="12" stroke="#6366F1" stroke-width="1.5"/>
    <text class="title" x="374" y="92">src/meta.ts</text>
    <text class="code muted" x="374" y="116" font-size="12">manual[] · vendors{}</text>
    <text class="muted" x="374" y="134" font-size="12">every skill declared once</text>

    <rect class="card" x="356" y="184" width="240" height="96" rx="12" stroke="#6366F1" stroke-width="1.5"/>
    <text class="title" x="374" y="212">skills/</text>
    <text class="code muted" x="374" y="236" font-size="12">one directory per skill</text>
    <text class="muted" x="374" y="260" font-size="12">checked against meta.ts in CI</text>

    <path class="rail" d="M476 144 V180" stroke-width="2" marker-end="url(#ska-head)"/>

    <!-- sources into skills/ -->
    <path class="rail" d="M276 112 C316 112 316 214 352 214" stroke-width="2" marker-end="url(#ska-head)"/>
    <path class="rail" d="M276 232 H352" stroke-width="2" marker-end="url(#ska-head)"/>

    <!-- install channels -->
    <rect class="panel" x="656" y="16" width="288" height="284" rx="18"/>
    <text class="label" x="676" y="44">install with</text>

    <rect class="card" x="676" y="60" width="248" height="68" rx="12" stroke="#14B8A6" stroke-width="1.5"/>
    <text class="title" x="692" y="86">skills CLI</text>
    <text class="code muted" x="692" y="110" font-size="11">npx skills add tada5hi/skills</text>

    <rect class="card" x="676" y="140" width="248" height="68" rx="12" stroke="#14B8A6" stroke-width="1.5"/>
    <text class="title" x="692" y="166">Claude Code plugin</text>
    <text class="code muted" x="692" y="190" font-size="11">/plugin install skills@tada5hi</text>

    <rect class="card" x="676" y="220" width="248" height="68" rx="12" stroke="#14B8A6" stroke-width="1.5"/>
    <text class="title" x="692" y="246">Codex plugin</text>
    <text class="code muted" x="692" y="270" font-size="11">codex plugin add skills@tada5hi</text>

    <path class="rail" d="M596 232 C636 232 636 94 672 94" stroke-width="2" marker-end="url(#ska-head)"/>
    <path class="rail" d="M596 232 C636 232 636 174 672 174" stroke-width="2" marker-end="url(#ska-head)"/>
    <path class="rail" d="M596 232 C636 232 636 254 672 254" stroke-width="2" marker-end="url(#ska-head)"/>

    <!-- a skill travelling from the repository to each channel: one pass -->
    <g>
        <circle r="9" fill="#14B8A6" fill-opacity="0.25"/>
        <circle r="4.5" fill="#14B8A6"/>
        <animateMotion dur="2.6s" repeatCount="1" fill="freeze" path="M596 232 C636 232 636 94 676 94"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" repeatCount="1" fill="freeze"/>
    </g>
    <g>
        <circle r="9" fill="#14B8A6" fill-opacity="0.25"/>
        <circle r="4.5" fill="#14B8A6"/>
        <animateMotion dur="2.6s" begin="-0.6s" repeatCount="1" fill="freeze" path="M596 232 C636 232 636 174 676 174"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="-0.6s" repeatCount="1" fill="freeze"/>
    </g>
    <g>
        <circle r="9" fill="#14B8A6" fill-opacity="0.25"/>
        <circle r="4.5" fill="#14B8A6"/>
        <animateMotion dur="2.6s" begin="-1.2s" repeatCount="1" fill="freeze" path="M596 232 C636 232 636 254 676 254"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="-1.2s" repeatCount="1" fill="freeze"/>
    </g>

    <!-- caveat -->
    <rect class="panel" x="16" y="320" width="928" height="44" rx="14" stroke-dasharray="5 5"/>
    <text class="muted" x="36" y="347" font-size="13">skills:sync replaces each vendor skill directory: change a vendor skill upstream, not in skills/.</text>
</svg>
